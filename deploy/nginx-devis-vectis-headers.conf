# En-têtes de sécurité du site, niveau server. Installés par deploy/setup-server.sh dans snippets/devis-vectis-headers.conf,
# en omettant tout en-tête DÉJÀ défini par le vhost (aucun en-tête n'est envoyé deux fois).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# 6 mois, sans includeSubDomains ni preload : les autres sous-domaines de mrprop.fr ne sont pas concernés.
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
