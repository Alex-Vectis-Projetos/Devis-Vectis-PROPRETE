# Inclus dans le server { } HTTPS de devis.mrprop.fr (inséré par deploy/setup-server.sh).
# Ne modifie ni la racine du site, ni TLS/Certbot.

# --- En-têtes de sécurité (niveau server : hérités par les location sans add_header propre) ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# 6 mois, sans includeSubDomains ni preload : les autres sous-domaines de mrprop.fr ne sont pas concernés.
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# --- API d'authentification : proxy local vers 127.0.0.1:3100 ---
# ^~ : une fois ce préfixe retenu, aucune regex ci-dessous (extensions, fichiers cachés) ne peut s'appliquer à /api/.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    client_max_body_size 8k;
    # Les en-têtes de sécurité sont posés par Nginx : pas de doublons venant de l'API.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    # location avec add_header propre : on répète les en-têtes (sinon ceux du server ne seraient pas hérités).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}

# --- Jamais servis : fichiers cachés, dépôt, code serveur, base, secrets, scripts de déploiement ---
location ~ /\.(?!well-known/) { return 404; }
location ^~ /server/ { return 404; }
location ^~ /deploy/ { return 404; }
location ^~ /.github/ { return 404; }
location ~* \.(db|sqlite|sqlite3|env|log|sh|service|md|json|lock)$ { return 404; }
