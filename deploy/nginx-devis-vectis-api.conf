# Inclus dans le server { } HTTPS de devis.mrprop.fr (inséré par deploy/setup-server.sh).

# API d'authentification : uniquement en proxy local vers 127.0.0.1:3100
location /api/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    client_max_body_size 8k;
}

# Jamais servis : fichiers cachés, dépôt, code serveur, base, secrets, scripts de déploiement
location ~ /\.(?!well-known/) { return 404; }
location ^~ /server/ { return 404; }
location ^~ /deploy/ { return 404; }
location ^~ /.github/ { return 404; }
location ~* \.(db|sqlite|sqlite3|env|log|sh|service|md|json|lock)$ { return 404; }
