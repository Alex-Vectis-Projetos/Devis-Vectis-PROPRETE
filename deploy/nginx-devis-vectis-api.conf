# Inclus dans le server { } HTTPS de devis.mrprop.fr (inséré par deploy/setup-server.sh).
# Ne modifie ni la racine du site, ni TLS/Certbot.

# --- En-têtes de sécurité du site : fichier séparé, généré par setup-server.sh sans doublons ---
include /etc/nginx/snippets/devis-vectis-headers.conf;

# --- API d'authentification : proxy local vers 127.0.0.1:3100 ---
# ^~ : une fois ce préfixe retenu, aucune regex ci-dessous (extensions, fichiers cachés) ne peut s'appliquer à /api/.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    client_max_body_size 8k;
    # Les en-têtes de sécurité sont posés par Nginx : pas de doublons venant de l'API.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    # location avec add_header propre : on répète les en-têtes (sinon ceux du server ne seraient pas hérités).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}

# --- Panneau d'administration du contenu : envois de fichiers (images, PDF) ---
# Seule cette route accepte de gros corps (11 Mo) ; le reste de /api/ reste limité à 8 Ko.
# L'authentification (session + CSRF) est vérifiée par l'API AVANT la lecture du corps.
location ^~ /api/admin/site/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_request_buffering on;
    client_max_body_size 11m;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}

# --- Demandes de devis publiques : une photo par requête (10 Mo max. chacune, vérifié par l'API) ---
# Avec la route d'administration ci-dessus, seule cette route accepte de gros corps (11 Mo) ; le reste de /api/ reste limité à 8 Ko.
# L'API limite chaque route : JSON 128 Ko, photo 10 Mo, signature de fichier contrôlée, débit limité par IP.
location ^~ /api/quotes {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_request_buffering on;
    client_max_body_size 11m;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}

# --- Jamais servis : fichiers cachés, dépôt, code serveur, base, secrets, scripts de déploiement ---
location ~ /\.(?!well-known/) { return 404; }
location ^~ /server/ { return 404; }
location ^~ /deploy/ { return 404; }
location ^~ /.github/ { return 404; }
location ~* \.(db|sqlite|sqlite3|env|log|sh|service|md|json|lock)$ { return 404; }
