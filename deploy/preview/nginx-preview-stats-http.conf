# PHASE A du vhost https://preview-stats.mrprop.fr : HTTP seulement, le temps d'obtenir le certificat (le fichier complet référence un certificat
# qui n'existe pas encore, donc `nginx -t` échouerait). À installer UNIQUEMENT après création de l'enregistrement DNS et autorisation.
server {
    listen 80;
    listen [::]:80;
    server_name preview-stats.mrprop.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
