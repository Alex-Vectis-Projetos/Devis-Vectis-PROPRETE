# vhost de https://preview-stats.mrprop.fr — à installer dans /etc/nginx/sites-available/ puis lien dans sites-enabled/ (après autorisation).
# Séparé du vhost de production : aucun include des snippets de production, proxy vers le port 3101 uniquement.
# Certificat : certbot --nginx -d preview-stats.mrprop.fr (ou webroot), après création de l'enregistrement DNS.

server {
    listen 80;
    listen [::]:80;
    server_name preview-stats.mrprop.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name preview-stats.mrprop.fr;
    ssl_certificate     /etc/letsencrypt/live/preview-stats.mrprop.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview-stats.mrprop.fr/privkey.pem;

    root /opt/devis-vectis-preview;
    index index.html;

    # Protection de tout le site de démonstration (identifiants créés par l'administrateur du serveur, hors dépôt).
    auth_basic "VECTIS preview";
    auth_basic_user_file /etc/nginx/preview-stats.htpasswd;

    # Jamais indexé.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 11m;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # Jamais servis : fichiers cachés, dépôt, code serveur, base, secrets, scripts de déploiement.
    location ~ /\.(?!well-known/) { return 404; }
    location ^~ /server/ { return 404; }
    location ^~ /deploy/ { return 404; }
    location ^~ /.github/ { return 404; }
    location ~* \.(db|sqlite|sqlite3|env|log|sh|service|md|json|lock|yml|yaml|example)$ { return 404; }
}
