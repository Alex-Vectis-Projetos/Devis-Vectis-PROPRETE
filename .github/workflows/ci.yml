name: CI — API d'authentification

# Tests only. Never deploys, never writes to the repository. Also called by deploy.yml before any deployment.
on:
  push:
    branches-ignore: [main]
    paths: ['server/**', 'deploy/**', '.github/workflows/**']
  pull_request:
    paths: ['server/**', 'deploy/**', '.github/workflows/**']
  workflow_dispatch:
  workflow_call:    # appelé par deploy.yml : les tests conditionnent le déploiement

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund   # strict : le package-lock.json commité fait foi
          echo "::notice title=versions::node $(node -v) | fastify $(node -p "require('fastify/package.json').version") | better-sqlite3 $(node -p "require('better-sqlite3/package.json').version") | @fastify/cookie $(node -p "require('@fastify/cookie/package.json').version")"

      - name: Run automated tests
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          grep -E "^(not ok|ok) " /tmp/test.log | head -60 | while read -r line; do echo "::notice title=test::$line"; done
          grep -E "^# (tests|pass|fail|skipped)" /tmp/test.log | while read -r line; do echo "::notice title=summary::$line"; done
          if [ "$code" -ne 0 ]; then grep -A12 "^not ok" /tmp/test.log | head -80 | while read -r line; do echo "::error title=failure::$line"; done; fi
          exit $code

      - name: Tests du script d'installation (faux nginx/systemctl/visudo, aucun fichier système)
        working-directory: .
        run: bash deploy/tests/setup-server.test.sh

      - name: Syntaxe des scripts shell et Python
        working-directory: .
        run: |
          bash -n deploy/setup-server.sh deploy/post-deploy.sh
          python3 -m py_compile deploy/nginx-insert.py

      - name: Smoke test — real server process (loopback only)
        run: |
          export HOST=127.0.0.1 PORT=3199 PUBLIC_ORIGIN=https://devis.test COOKIE_SECURE=false \
                 ADMIN_EMAILS=admin@example.test SESSION_SECRET=$(head -c 48 /dev/urandom | base64 | tr -d '\n=+/') \
                 DB_PATH=$RUNNER_TEMP/smoke/devis.db
          npm run init-db
          node src/index.js > $RUNNER_TEMP/smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3199/api/health && break; sleep 0.5; done
          echo
          echo "::notice title=smoke::health=$(curl -s http://127.0.0.1:3199/api/health)"
          echo "::notice title=smoke::unauth admin ping HTTP $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3199/api/admin/ping)"
          echo "::notice title=smoke::cross-origin POST HTTP $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -d '{"email":"a@b.c"}' http://127.0.0.1:3199/api/admin/auth/request)"
          echo "::notice title=smoke::listening on $(ss -ltn | grep 3199 | awk '{print $4}' | tr '\n' ' ')"
          kill $pid
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3199/api/health || true)" != "200" || true
