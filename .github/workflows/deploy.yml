name: Deploy Devis VECTIS

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: devis-vectis-production
  cancel-in-progress: false

jobs:
  # Aucun déploiement sans tests verts.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH (host key verification)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Optionnel mais recommandé : sortie de `ssh-keyscan -p <port> <hôte>` (ou ligne known_hosts), prise depuis
          # une source de confiance. Sans lui, la clé est récupérée à chaque exécution (non vérifiée).
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_HOST_KEY" ]; then
            printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
            echo "::notice title=ssh::empreinte du serveur vérifiée (VPS_HOST_KEY)"
          else
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo "::warning title=ssh::VPS_HOST_KEY non défini : empreinte du serveur NON vérifiée. Ajoutez ce secret."
          fi

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'cd /opt/devis-vectis && git pull --ff-only origin main'

      # Aucune opération privilégiée : après `git pull`, seul `sudo systemctl restart devis-vectis-api` (règle
      # sudoers exacte installée une fois par l'administrateur) peut être demandé. Sans l'installation initiale,
      # le script le constate et sort sans rien tenter. Une vraie panne du service fait échouer l'étape.
      - name: Install dependencies and restart API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'bash /opt/devis-vectis/deploy/post-deploy.sh'

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
