name: Deploy Devis VECTIS

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: devis-vectis-production
  cancel-in-progress: false

jobs:
  # Aucun déploiement sans tests verts.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH (host key verification)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # VPS_HOST_KEY doit provenir d'une source de confiance, jamais de la connexion courante.
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          if [ -z "$VPS_HOST_KEY" ]; then
            echo "::error title=ssh::secret VPS_HOST_KEY obligatoire"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          echo "::notice title=ssh::empreinte du serveur chargée depuis VPS_HOST_KEY"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'cd /opt/devis-vectis && git pull --ff-only origin main'

      # Mise à jour limitée au service API via Docker Compose, sans sudo ni systemd.
      - name: Build and update API with Docker Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'bash /opt/devis-vectis/deploy/post-deploy.sh'

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
