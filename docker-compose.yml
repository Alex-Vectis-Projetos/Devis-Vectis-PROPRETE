name: devis-vectis

services:
  api:
    container_name: devis-vectis-api
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CONTAINERIZED: "true"
      HOST: 0.0.0.0
      PORT: "3100"
      PUBLIC_ORIGIN: https://devis.mrprop.fr
      DB_PATH: /var/lib/devis-vectis/devis.db
      COOKIE_SECURE: "true"
      # Nginx (hôte) → 127.0.0.1:3100 est vu par le conteneur comme venant du gateway du réseau bridge, pas de 127.0.0.1.
      # Seule cette adresse est de confiance pour lire X-Forwarded-For (vérifié en production). Si le réseau est recréé
      # avec un autre gateway, cette valeur doit être mise à jour (docker network inspect devis_vectis_network).
      TRUST_PROXY: 172.16.11.1
      # Mesure d'audience : activée le 23/11/2026 (consentement préalable du visiteur, voir deploy/STATS-ACTIVATION.md). Pour désactiver : "false", puis déploiement.
      STATS_ENABLED: "true"
    env_file:
      - /etc/devis-vectis/api.env
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - devis_vectis_data:/var/lib/devis-vectis
    networks:
      - devis_vectis_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  devis_vectis_data:
    name: devis_vectis_data

networks:
  devis_vectis_network:
    name: devis_vectis_network
    driver: bridge
